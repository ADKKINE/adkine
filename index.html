<style>
/* ============================================================
   ADKINE — block-based page. Everything is driven by
   content/site.json → blocks[]. Colours, type and spacing come
   from → theme and → style.
   ============================================================ */
:root{
  --black:#16181C; --ink:#23262C; --navy:#2E4057;
  --blue:#93AEC9; --blue-pale:#DCE6F0;
  --beige:#D8C9AF; --beige-pale:#F0E9DC;
  --white:#FCFAF7;
  --line:rgba(46,64,87,.14); --muted:rgba(35,38,44,.58);
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --k-head:1; --k-body:1; --k-space:1; --track:-.02em;
  /* every vw in this stylesheet goes through --vw, so the editor can shrink the
     whole page to phone width and still get true phone proportions */
  --vw:1vw;
  --serif:var(--font-display); --sans:var(--font-body);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{background:var(--white);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.65;overflow-x:hidden}
::selection{background:var(--blue);color:var(--white)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

.cursor,.cursor-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;border-radius:50%;mix-blend-mode:multiply}
.cursor{width:6px;height:6px;background:var(--navy);transform:translate(-50%,-50%)}
.cursor-ring{width:34px;height:34px;border:1px solid var(--blue);transform:translate(-50%,-50%);transition:width .3s var(--ease),height .3s var(--ease),background .3s}
.cursor-ring.grow{width:64px;height:64px;background:rgba(147,174,201,.16)}
@media(hover:none),(max-width:900px){.cursor,.cursor-ring{display:none}}

/* ---------- nav ---------- */
nav{position:fixed;inset:0 0 auto 0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:34px calc(5*var(--vw));transition:all .5s var(--ease)}
nav.scrolled{padding:18px calc(5*var(--vw));background:rgba(252,250,247,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:19px;letter-spacing:.16em}
.logo .ki{color:var(--navy)}
.nav-links{display:flex;gap:44px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:400}
.nav-links a{position:relative;padding-bottom:4px;color:var(--muted);transition:color .4s}
.nav-links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--navy);transition:width .45s var(--ease)}
.nav-links a:hover{color:var(--ink)}
.nav-links a:hover::after{width:100%}
.burger{display:none;flex-direction:column;gap:5px;cursor:pointer}
.burger span{width:24px;height:1px;background:var(--ink);transition:.4s var(--ease)}
@media(max-width:860px){
  .nav-links{position:fixed;inset:0;background:var(--white);flex-direction:column;align-items:center;justify-content:center;gap:32px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
  .nav-links.open{opacity:1;pointer-events:all}
  .burger{display:flex;z-index:101}
  .burger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .burger.open span:nth-child(2){opacity:0}
  .burger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
}

.reveal{opacity:0;transform:translateY(38px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.reveal.in{opacity:1;transform:none}
.reveal[data-d="1"]{transition-delay:.12s}
.reveal[data-d="2"]{transition-delay:.24s}
.reveal[data-d="3"]{transition-delay:.36s}
.reveal[data-d="4"]{transition-delay:.48s}

/* ---------- device preview (editor only) ----------
   Phone mode narrows the document to a phone width and rewrites --vw so every
   fluid size behaves exactly as it would on a real phone. The @media rules are
   mirrored onto body.dev-mobile at runtime (buildDeviceCSS) so nothing has to
   be written twice. */
html.dev-frame{background:#E4E0D8}
body.dev-mobile{--vw:4.3px;width:430px;margin:0 auto;overflow-x:hidden;
  box-shadow:0 0 0 1px rgba(46,64,87,.18),0 24px 70px rgba(22,24,28,.22)}
body.dev-mobile nav{left:50%;right:auto;width:430px;margin-left:-215px}
body.dev-mobile .cursor,body.dev-mobile .cursor-ring{display:none}
/* hidden on this device */
.d-hidden{display:none!important}
body.ed-on .d-hidden{display:block!important;opacity:.28;filter:grayscale(1);
  outline:2px dashed rgba(46,64,87,.5)}

/* ---------- blocks ---------- */
.blk{position:relative;padding:calc(clamp(90px,calc(13*var(--vw)),170px)*var(--k-space)*var(--pad,1)) calc(5*var(--vw))}
/* optional background photo behind any block */
.blk-bg{position:absolute;inset:0;z-index:0;background-repeat:no-repeat;pointer-events:none}
.blk-bg.fixed{background-attachment:fixed}
/* lift real content above the background photo — but never the editor's own
   toolbars, or they'd lose their absolute positioning and z-index */
.blk > *:not(.blk-bg):not(.hero-media):not(.ed-blkbar):not(.ed-blkname){position:relative;z-index:1}
.blk.bg-white{background:var(--white)}
.blk.bg-beige{background:var(--beige-pale)}
.blk.bg-blue{background:var(--blue-pale)}
.blk.bg-navy{background:var(--navy);color:rgba(252,250,247,.72)}
.blk.bg-black{background:var(--black);color:rgba(240,233,220,.62)}
.blk.bg-navy h2,.blk.bg-black h2,.blk.bg-navy h3,.blk.bg-black h3,
.blk.bg-navy .stat b,.blk.bg-black .stat b{color:var(--white)}
.blk.bg-navy .sec-num,.blk.bg-black .sec-num{color:var(--beige)}
.blk.bg-navy .ph-label,.blk.bg-black .ph-label{color:var(--beige-pale)}
.blk.center{text-align:center}
.blk.center .sec-head{justify-content:center;flex-direction:column;align-items:center;text-align:center}

.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:70px;flex-wrap:wrap}
.sec-num{font-size:11px;letter-spacing:.3em;color:var(--blue);font-weight:500}
.sec-head h2{font-family:var(--serif);font-weight:300;font-size:calc(clamp(2.4rem,calc(5.6*var(--vw)),4.6rem)*var(--k-head));line-height:1.02;letter-spacing:var(--track);color:var(--black)}
.sec-head p{max-width:340px;font-size:calc(15px*var(--k-body));color:var(--muted)}
.blk.bg-navy .sec-head p,.blk.bg-black .sec-head p{color:inherit}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:0 calc(5*var(--vw));overflow:hidden}
.hero-media{position:absolute;inset:0;z-index:0;background:linear-gradient(120deg,var(--blue-pale) 0%,var(--beige-pale) 55%,var(--white) 100%)}
.hero-media video,.hero-media iframe{width:100%;height:100%;object-fit:cover;border:0}
.hero-media::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(252,250,247,.92) 0%,rgba(252,250,247,.55) 50%,rgba(252,250,247,.2) 100%)}
/* with a background photo the hero's own gradient would sit on top of it —
   go transparent and soften the readability scrim instead */
.hero-media.has-photo{background:none}
.hero-media.has-photo::after{background:linear-gradient(90deg,rgba(252,250,247,.70) 0%,rgba(252,250,247,.32) 45%,rgba(252,250,247,.04) 100%)}
.hero-inner{position:relative;z-index:2;max-width:1000px}
.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--navy);margin-bottom:30px;font-weight:500}
.hero h1{font-family:var(--serif);font-weight:300;font-size:calc(clamp(3.4rem,calc(9.5*var(--vw)),9rem)*var(--k-head));line-height:.94;letter-spacing:var(--track);color:var(--black);margin-bottom:34px}
.hero h1 em{font-style:italic;color:var(--navy)}
.hero p{max-width:440px;font-size:calc(16px*var(--k-body));color:var(--muted);margin-bottom:48px}
.scroll-hint{position:absolute;bottom:42px;left:calc(5*var(--vw));z-index:2;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:14px}
.scroll-hint::after{content:'';width:52px;height:1px;background:var(--blue);animation:slide 2.4s var(--ease) infinite}
@keyframes slide{0%{transform:scaleX(0);transform-origin:left}50%{transform:scaleX(1);transform-origin:left}51%{transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}

/* buttons */
.btn-row{display:flex;gap:16px;flex-wrap:wrap}
.blk.center .btn-row{justify-content:center}
.btn{display:inline-block;padding:17px 40px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;border:1px solid var(--navy);position:relative;overflow:hidden;transition:color .5s var(--ease)}
.btn span{position:relative;z-index:2}
.btn::before{content:'';position:absolute;inset:0;background:var(--navy);transform:translateY(101%);transition:transform .55s var(--ease)}
.btn:hover::before{transform:translateY(0)}
.btn:hover{color:var(--white)}
.btn.solid{background:var(--navy);color:var(--white)}
.btn.solid::before{background:var(--beige)}
.btn.solid:hover{color:var(--black)}
.bg-navy .btn,.bg-black .btn{border-color:var(--beige)}
.bg-navy .btn::before,.bg-black .btn::before{background:var(--beige)}
.bg-navy .btn:hover,.bg-black .btn:hover{color:var(--black)}

/* marquee */
.marquee{padding:calc(26px*var(--pad,1)) 0;background:var(--navy);color:var(--beige-pale);overflow:hidden;white-space:nowrap}
.marquee-track{display:inline-flex;gap:60px;animation:scroll 34s linear infinite;font-family:var(--serif);font-size:calc(26px*var(--k-head));letter-spacing:.04em}
.marquee-track span{opacity:.85}
.marquee-track i{font-style:normal;color:var(--blue)}
@keyframes scroll{to{transform:translateX(-50%)}}

/* projects */
.work-grid{display:grid;gap:clamp(20px,calc(3.4*var(--vw)),52px)}
.work-grid.c1{grid-template-columns:1fr}
.work-grid.c2{grid-template-columns:repeat(2,1fr)}
.work-grid.c3{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.work-grid{grid-template-columns:1fr!important}}
.project{cursor:pointer;display:block}
.work-grid.c2 .project:nth-child(even){margin-top:clamp(0px,calc(5*var(--vw)),80px)}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,var(--blue-pale),var(--beige-pale))}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.project:hover .thumb img{transform:scale(1.06)}
.thumb::after{content:'';position:absolute;inset:0;background:var(--navy);opacity:0;transition:opacity .6s var(--ease)}
.project:hover .thumb::after{opacity:.14}
.ph-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--navy);opacity:.5;text-align:center;padding:12px}
.ph-label b{font-size:26px;font-family:var(--serif);font-weight:300;letter-spacing:.04em}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);width:72px;height:72px;border:1px solid var(--white);border-radius:50%;display:grid;place-items:center;opacity:0;transition:.6s var(--ease);z-index:3}
.play::after{content:'';border-left:11px solid var(--white);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:4px}
.project:hover .play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.p-meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;gap:20px}
.p-meta h3{font-family:var(--serif);font-weight:400;font-size:calc(clamp(1.3rem,calc(2.4*var(--vw)),1.9rem)*var(--k-head));color:var(--black)}
.p-meta span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.bg-navy .p-meta span,.bg-black .p-meta span{color:inherit}

/* gallery */
.g-grid{display:grid;gap:14px}
.g-grid.c2{grid-template-columns:repeat(2,1fr)}
.g-grid.c3{grid-template-columns:repeat(3,1fr)}
.g-grid.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g-grid{grid-template-columns:repeat(2,1fr)!important}}
.g-item{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--blue-pale),var(--white));aspect-ratio:3/4}
.g-item img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.g-item:hover img{transform:scale(1.07)}

/* services */
.s-grid{display:grid;gap:1px;background:var(--line)}
.s-grid.c1{grid-template-columns:1fr}
.s-grid.c2{grid-template-columns:repeat(2,1fr)}
.s-grid.c3{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.s-grid{grid-template-columns:1fr!important}}
.s-card{background:var(--white);padding:clamp(38px,calc(5*var(--vw)),64px);transition:background .6s var(--ease)}
.bg-black .s-grid,.bg-navy .s-grid{background:rgba(240,233,220,.16)}
.bg-black .s-card{background:var(--black)}
.bg-navy .s-card{background:var(--navy)}
.s-card:hover{background:var(--blue-pale)}
.bg-black .s-card:hover{background:var(--navy)}
.bg-navy .s-card:hover{background:var(--black)}
.s-card .n{font-size:11px;letter-spacing:.3em;color:var(--blue);margin-bottom:26px}
.s-card h3{font-family:var(--serif);font-weight:300;font-size:calc(clamp(1.8rem,calc(3.4*var(--vw)),2.8rem)*var(--k-head));color:var(--black);margin-bottom:20px}
.s-card p{font-size:calc(15px*var(--k-body));color:var(--muted);margin-bottom:28px}
.bg-black .s-card p,.bg-navy .s-card p{color:inherit}
.s-card ul{list-style:none;font-size:calc(13px*var(--k-body));color:var(--muted)}
.s-card li{padding:9px 0;border-top:1px solid var(--line);letter-spacing:.04em}
.bg-black .s-card li,.bg-navy .s-card li{border-color:rgba(240,233,220,.13)}

/* about */
.a-wrap{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(36px,calc(6*var(--vw)),90px);align-items:center}
.a-wrap.flip{direction:rtl}
.a-wrap.flip>*{direction:ltr}
@media(max-width:860px){.a-wrap{grid-template-columns:1fr;direction:ltr!important}}
.a-photo{aspect-ratio:4/5;background:linear-gradient(150deg,var(--beige-pale),var(--blue-pale));overflow:hidden;position:relative}
.a-photo img{width:100%;height:100%;object-fit:cover}
.a-text h2{font-family:var(--serif);font-weight:300;font-size:calc(clamp(2rem,calc(4.4*var(--vw)),3.4rem)*var(--k-head));line-height:1.1;color:var(--black);margin:10px 0 28px}
.a-text p{font-size:calc(16px*var(--k-body));color:var(--muted);margin-bottom:20px;max-width:520px}
.bg-navy .a-text p,.bg-black .a-text p{color:inherit}
.stats{display:flex;gap:52px;margin-top:44px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--serif);font-size:calc(2.6rem*var(--k-head));font-weight:300;color:var(--navy);line-height:1}
.stat span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.bg-navy .stat span,.bg-black .stat span{color:inherit}

/* contact */
.contact-blk{text-align:center}
.contact-blk h2{font-family:var(--serif);font-weight:300;font-size:calc(clamp(2.6rem,calc(7*var(--vw)),6rem)*var(--k-head));line-height:1.02;letter-spacing:var(--track);margin:18px 0 34px;color:var(--black)}
.contact-blk p{max-width:420px;margin:0 auto 46px;font-size:calc(16px*var(--k-body));color:var(--muted)}
.bg-navy .contact-blk p,.bg-black .contact-blk p{color:inherit}
.mail{display:inline-block;font-family:var(--serif);font-size:calc(clamp(1.3rem,calc(3.4*var(--vw)),2.4rem)*var(--k-head));color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:8px;transition:.5s var(--ease)}
.bg-navy .mail,.bg-black .mail{color:var(--beige-pale);border-color:rgba(216,201,175,.4)}
.mail:hover{color:var(--beige);border-color:var(--beige)}
.socials{display:flex;gap:34px;justify-content:center;margin-top:56px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.bg-navy .socials,.bg-black .socials{color:rgba(252,250,247,.55)}
.socials a:hover{color:var(--beige)}

/* text block */
.txt-wrap{max-width:760px}
.blk.center .txt-wrap{margin:0 auto}
.txt-wrap h2{font-family:var(--serif);font-weight:300;font-size:calc(clamp(2rem,calc(4.4*var(--vw)),3.4rem)*var(--k-head));line-height:1.08;letter-spacing:var(--track);color:var(--black);margin-bottom:24px}
.txt-wrap p{font-size:calc(16px*var(--k-body));color:var(--muted);margin-bottom:18px}
.bg-navy .txt-wrap p,.bg-black .txt-wrap p{color:inherit}

/* single image / video */
.media-wrap{margin:0 auto}
.media-wrap.w-narrow{max-width:760px}
.media-wrap.w-wide{max-width:1200px}
.media-wrap.w-full{max-width:none}
.media-box{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--blue-pale),var(--beige-pale));aspect-ratio:16/9}
.media-box img,.media-box video,.media-box iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.media-cap{margin-top:14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* quote */
.quote-wrap{max-width:860px;margin:0 auto;text-align:center}
.quote-wrap blockquote{font-family:var(--serif);font-weight:300;font-style:italic;
  font-size:calc(clamp(1.6rem,calc(3.6*var(--vw)),2.8rem)*var(--k-head));line-height:1.28;color:var(--black)}
.bg-navy .quote-wrap blockquote,.bg-black .quote-wrap blockquote{color:var(--white)}
.quote-wrap .who{margin-top:28px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--blue)}

/* logos strip */
.logos{display:flex;flex-wrap:wrap;gap:clamp(28px,calc(5*var(--vw)),70px);align-items:center;justify-content:center}
.logo-item{font-family:var(--serif);font-size:calc(1.5rem*var(--k-head));color:var(--muted);letter-spacing:.02em}
.bg-navy .logo-item,.bg-black .logo-item{color:inherit}

/* spacer + divider */
.blk.spacer{padding:0}
.spacer-inner{height:var(--h,80px)}
.blk.divider{padding-top:0;padding-bottom:0}
.divider-line{height:1px;background:var(--line);margin:calc(40px*var(--pad,1)) 0}
.bg-navy .divider-line,.bg-black .divider-line{background:rgba(240,233,220,.2)}

footer{background:var(--black);color:rgba(240,233,220,.42);padding:38px calc(5*var(--vw));display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.14em;flex-wrap:wrap;gap:14px}

.modal{position:fixed;inset:0;z-index:500;background:rgba(22,24,28,.94);display:grid;place-items:center;padding:calc(5*var(--vw));opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.modal.open{opacity:1;pointer-events:all}
.modal-inner{width:min(1100px,100%);aspect-ratio:16/9;background:var(--ink);position:relative}
.modal-inner iframe,.modal-inner video{width:100%;height:100%;border:0;object-fit:cover}
.modal-ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--blue);font-size:12px;letter-spacing:.24em;text-transform:uppercase;text-align:center;padding:20px;line-height:2}
.close{position:absolute;top:-46px;right:0;color:var(--beige-pale);font-size:11px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => 'b' + Math.random().toString(36).slice(2, 9);

/* ============ load ============ */
async function loadContent(){
  try{
    const r = await fetch('content/site.json?t=' + Date.now(), {cache:'no-store'});
    if(r.ok) return migrate(await r.json());
  }catch(e){}
  return migrate(JSON.parse(document.getElementById('fallback').textContent));
}

/* ============ migrate old (fixed-section) data to blocks ============ */
function migrate(d){
  d = d && typeof d === 'object' ? d : {};
  d.brand   = d.brand   || {};
  d.theme   = d.theme   || {};
  d.style   = d.style   || {};
  d.offsets = d.offsets || {};
  d.offsetsMobile = d.offsetsMobile || {};
  d.textStyles    = d.textStyles    || {};
  d.footer  = d.footer  || {};
  d.nav     = Array.isArray(d.nav) ? d.nav : [];
  if (Array.isArray(d.blocks)) return d;

  const B = [];
  const h = d.hero || {};
  B.push({ id:'hero', type:'hero',
    eyebrow:h.eyebrow||'', titleLine1:h.titleLine1||'', titleLine2:h.titleLine2||'',
    titleAccent:h.titleAccent||'', paragraph:h.paragraph||'', backgroundVideo:h.backgroundVideo||'',
    buttons:[ {label:h.primaryLabel||'View Work', link:h.primaryLink||'#work', solid:true},
              {label:h.secondaryLabel||'Get in Touch', link:h.secondaryLink||'#contact', solid:false} ] });
  if (Array.isArray(d.marquee) && d.marquee.length)
    B.push({ id:'mq', type:'marquee', items:d.marquee.slice() });
  if (d.work) B.push({ id:'work', type:'projects', bg:'white', columns:2,
    label:d.work.label||'', heading:d.work.heading||'', intro:d.work.intro||'',
    items:(d.work.projects||[]).slice() });
  if (d.gallery) B.push({ id:'gallery', type:'gallery', bg:'beige', columns:4,
    label:d.gallery.label||'', heading:d.gallery.heading||'', intro:d.gallery.intro||'',
    items:(d.gallery.photos||[]).slice() });
  if (d.services) B.push({ id:'services', type:'services', bg:'black', columns:2,
    label:d.services.label||'', heading:d.services.heading||'', intro:d.services.intro||'',
    items:(d.services.items||[]).slice() });
  if (d.about) B.push({ id:'about', type:'about', bg:'white',
    label:d.about.label||'', heading:d.about.heading||'', photo:d.about.photo||'',
    paragraphs:(d.about.paragraphs||[]).slice(), stats:(d.about.stats||[]).slice() });
  if (d.contact) B.push({ id:'contact', type:'contact', bg:'navy',
    label:d.contact.label||'', heading:d.contact.heading||'', intro:d.contact.intro||'',
    email:d.contact.email||'', socials:(d.contact.socials||[]).slice() });

  // honour an old sectionOrder if one was saved
  if (Array.isArray(d.sectionOrder)) {
    const rank = id => { const i = d.sectionOrder.indexOf(id); return i < 0 ? 99 : i; };
    const fixed = B.filter(b => ['hero','mq'].includes(b.id));
    const rest  = B.filter(b => !['hero','mq'].includes(b.id)).sort((a,b)=>rank(a.id)-rank(b.id));
    d.blocks = [...fixed, ...rest];
  } else d.blocks = B;

  ['hero','marquee','work','gallery','services','about','contact','sectionOrder']
    .forEach(k => delete d[k]);
  return d;
}

/* ============ theme / type ============ */
function applyTheme(t={}){
  const map = {blue:'--blue',navy:'--navy',beige:'--beige',beigePale:'--beige-pale',bluePale:'--blue-pale',white:'--white',black:'--black'};
  for(const k in map) if(t[k]) document.documentElement.style.setProperty(map[k], t[k]);
}
const FONT_STACK = {
  'Cormorant Garamond':"'Cormorant Garamond',Georgia,serif",
  'Playfair Display':"'Playfair Display',Georgia,serif",
  'DM Serif Display':"'DM Serif Display',Georgia,serif",
  'Bodoni Moda':"'Bodoni Moda',Didot,Georgia,serif",
  'Marcellus':"'Marcellus',Georgia,serif",
  'Italiana':"'Italiana',Georgia,serif",
  'Libre Baskerville':"'Libre Baskerville',Georgia,serif",
  'Syne':"'Syne',Helvetica,sans-serif",
  'Space Grotesk':"'Space Grotesk',Helvetica,sans-serif",
  'Inter':"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",
  'DM Sans':"'DM Sans',Helvetica,sans-serif",
  'Work Sans':"'Work Sans',Helvetica,sans-serif",
  'Manrope':"'Manrope',Helvetica,sans-serif",
  'Karla':"'Karla',Helvetica,sans-serif",
  'Jost':"'Jost',Helvetica,sans-serif",
  'IBM Plex Sans':"'IBM Plex Sans',Helvetica,sans-serif",
};
const loadedFonts = new Set(['Cormorant Garamond','Inter']);
function ensureFont(name){
  if(!name || loadedFonts.has(name) || !FONT_STACK[name]) return;
  loadedFonts.add(name);
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=' + name.replace(/ /g,'+') +
           ':ital,wght@0,300;0,400;0,500;0,600;0,800;1,300&display=swap';
  document.head.appendChild(l);
}
function applyStyle(d){
  const s = d.style || {}, r = document.documentElement.style;
  if(s.displayFont){ ensureFont(s.displayFont); r.setProperty('--font-display', FONT_STACK[s.displayFont] || s.displayFont); }
  if(s.bodyFont){ ensureFont(s.bodyFont); r.setProperty('--font-body', FONT_STACK[s.bodyFont] || s.bodyFont); }
  r.setProperty('--k-head',  s.headScale  ?? 1);
  r.setProperty('--k-body',  s.bodyScale  ?? 1);
  r.setProperty('--k-space', s.spaceScale ?? 1);
  r.setProperty('--track',   (s.tracking ?? -0.02) + 'em');
}

/* ============ device (desktop / phone) ============
   Desktop settings are the base. Phone settings are overrides layered on top,
   so anything you never touch on the phone simply follows the desktop. */
let FORCED_DEVICE = null;
const device = () => FORCED_DEVICE || (innerWidth <= 900 ? 'mobile' : 'desktop');

/* block fields that can hold a different value on the phone */
const DEVICE_KEYS = ['pad','align','columns','height','width','ratio','flip','hidden',
                     'bgOpacity','bgPosition','bgSize','bgFixed'];
function forDevice(b){
  if(device() !== 'mobile' || !b.mobile) return b;
  const o = {...b};
  for(const k of DEVICE_KEYS){
    const v = b.mobile[k];
    if(v !== undefined && v !== null) o[k] = v;
  }
  return o;
}

/* Mirror every max-width media rule onto body.dev-mobile so the phone frame
   picks up the real mobile CSS without any of it being written twice. */
function buildDeviceCSS(){
  if(document.getElementById('devCSS')) return;
  const out = [];
  for(const sheet of document.styleSheets){
    let rules; try{ rules = sheet.cssRules; }catch(e){ continue; }
    if(!rules) continue;
    for(const r of rules){
      const cond = r.conditionText || r.media?.mediaText || '';
      if(r.type !== 4 /* CSSMediaRule */ || !/max-width/.test(cond)) continue;
      const widths = [...cond.matchAll(/max-width:\s*(\d+)px/g)].map(m=>+m[1]);
      if(widths.length && Math.max(...widths) < 430) continue;   // narrower than the frame
      for(const inner of r.cssRules){
        if(!inner.selectorText || !inner.style) continue;
        const sel = inner.selectorText.split(',').map(s=>{
          s = s.trim();
          if(/^html\b/.test(s)) return s.replace(/^html/, 'html body.dev-mobile');
          if(/^body\b/.test(s)) return s.replace(/^body/, 'body.dev-mobile');
          return 'body.dev-mobile ' + s;
        }).join(',');
        out.push(sel + '{' + inner.style.cssText + '}');
      }
    }
  }
  const st = document.createElement('style');
  st.id = 'devCSS';
  st.textContent = out.join('\n');
  document.head.appendChild(st);
}

function setDevice(mode){
  buildDeviceCSS();
  FORCED_DEVICE = (mode === 'desktop' || mode === 'mobile') ? mode : null;
  const mob = device() === 'mobile';
  document.body.classList.toggle('dev-mobile', !!FORCED_DEVICE && mob);
  document.documentElement.classList.toggle('dev-frame', !!FORCED_DEVICE && mob);
  return device();
}

/* Light re-sync when the real window crosses the phone/desktop line — cheaper
   and safer than re-rendering (which would re-bind every listener). */
function applyBlockDevice(d){
  (d.blocks||[]).forEach((b,i)=>{
    const el = document.querySelector(`#blocks > [data-blk="${i}"]`);
    if(!el) return;
    const v = forDevice(b);
    el.classList.toggle('d-hidden', !!v.hidden);
    el.style.setProperty('--pad', v.pad ?? 1);
    if(['text','buttons','quote'].includes(b.type)) el.classList.toggle('center', v.align === 'center');
    const grid = el.querySelector('.work-grid,.g-grid,.s-grid');
    if(grid && v.columns) grid.className = grid.className.replace(/\bc\d+\b/, 'c'+v.columns);
    const sp = el.querySelector('.spacer-inner');
    if(sp && v.height) sp.style.setProperty('--h', (parseInt(v.height)||80)+'px');
    const bg = el.querySelector('.blk-bg');
    if(bg){
      bg.style.opacity = v.bgOpacity ?? 0.6;
      bg.style.backgroundPosition = v.bgPosition || 'center center';
      bg.style.backgroundSize = v.bgSize || 'cover';
      bg.classList.toggle('fixed', !!v.bgFixed);
    }
    const mw = el.querySelector('.media-wrap');
    if(mw && v.width) mw.className = mw.className.replace(/\bw-\w+\b/, 'w-'+v.width);
    const mb = el.querySelector('.media-box');
    if(mb && b.type === 'image' && v.ratio) mb.style.aspectRatio = v.ratio;
  });
}

/* ============ per-text styling ============
   Every individual bit of text on the page carries a stable key
   (block id + field). d.textStyles[key].desktop / .mobile hold its own font,
   size, weight, colour, alignment, spacing — phone layered over desktop. */
function tkeyOf(path, blocks){
  const m = /^blocks\.(\d+)\.(.+)$/.exec(path || '');
  if(!m) return path || '';
  const b = (blocks||[])[+m[1]];
  return (b && b.id ? b.id : m[1]) + '.' + m[2];
}
const TXT_CSS = {
  font:       v => ['font-family',    FONT_STACK[v] || v],
  size:       v => ['font-size',      parseFloat(v) + 'px'],
  weight:     v => ['font-weight',    String(v)],
  color:      v => ['color',          v],
  align:      v => ['text-align',     v],
  tracking:   v => ['letter-spacing', parseFloat(v) + 'em'],
  lineHeight: v => ['line-height',    String(v)],
  italic:     v => ['font-style',     v ? 'italic' : 'normal'],
  caps:       v => ['text-transform', v ? 'uppercase' : 'none'],
};
const TXT_PROPS = ['font-family','font-size','font-weight','color','text-align',
                   'letter-spacing','line-height','font-style','text-transform'];
function textStyleFor(d, key){
  const t = (d.textStyles || {})[key];
  if(!t) return null;
  const base = t.desktop || {};
  return device() === 'mobile' ? {...base, ...(t.mobile || {})} : base;
}
function tagTexts(d){
  document.querySelectorAll('[data-path]:not([data-tkey])').forEach(el=>{
    el.dataset.tkey = tkeyOf(el.dataset.path, d.blocks);
  });
}
function applyTextStyles(d){
  document.querySelectorAll('[data-tkey]').forEach(el=>{
    TXT_PROPS.forEach(p => el.style.removeProperty(p));
    const s = textStyleFor(d, el.dataset.tkey);
    if(!s) return;
    for(const k in s){
      const f = TXT_CSS[k], v = s[k];
      if(!f || v === undefined || v === null || v === '') continue;
      const [prop, val] = f(v);
      el.style.setProperty(prop, val, 'important');
    }
    if(s.font) ensureFont(s.font);
  });
}

function applyOffsets(d){
  const o = (device() === 'mobile' ? d.offsetsMobile : d.offsets) || {};
  document.querySelectorAll('[data-move]').forEach(el=>{
    const v = o[el.dataset.move];
    el.style.transform = (v && (v.x || v.y)) ? `translate(${v.x}px,${v.y}px)` : '';
  });
}

let lastDevice = null;
addEventListener('resize', ()=>{
  if(!window.ADKINE) return;
  const now = device();
  if(now === lastDevice) return;
  lastDevice = now;
  applyBlockDevice(window.ADKINE.data);
  applyTextStyles(window.ADKINE.data);
  applyOffsets(window.ADKINE.data);
});

/* ============ video helpers ============ */
function videoInfo(url){
  if(!url) return null;
  const s = String(url).trim(); let m;
  if((m = s.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{6,})/)))
    return {type:'yt', id:m[1]};
  if((m = s.match(/(?:vimeo\.com\/(?:video\/)?|player\.vimeo\.com\/video\/)(\d+)/)))
    return {type:'vimeo', id:m[1]};
  return null;
}
const embedUrl = u => { const v=videoInfo(u); return !v ? u :
  v.type==='yt' ? `https://www.youtube.com/embed/${v.id}` : `https://player.vimeo.com/video/${v.id}`; };
const posterUrl = u => { const v=videoInfo(u);
  return (v && v.type==='yt') ? `https://img.youtube.com/vi/${v.id}/hqdefault.jpg` : ''; };
function mediaEmbed(url, opts={}){
  if(!url) return '';
  if(/\.(mp4|webm|mov)$/i.test(url))
    return `<video src="${esc(url)}" ${opts.bg?'autoplay muted loop playsinline':'controls playsinline'}></video>`;
  return `<iframe src="${esc(embedUrl(url))}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
}

/* ============ block renderers ============ */
const P = (i, ...k) => `blocks.${i}.${k.join('.')}`;   // data path helper
/* text that is allowed to hold line breaks (stored as \n, drawn as <br>) */
const multi = s => esc(String(s ?? '').replace(/<br\s*\/?>/gi, '\n')).replace(/\n/g, '<br>');

function head(b, i){
  if(!b.label && !b.heading && !b.intro) return '';
  return `<div class="sec-head" data-move="${b.id}.head">
    <div>
      <div class="sec-num reveal" data-path="${P(i,'label')}">${esc(b.label)}</div>
      <h2 class="reveal" data-d="1" data-path="${P(i,'heading')}">${esc(b.heading)}</h2>
    </div>
    <p class="reveal" data-d="2" data-path="${P(i,'intro')}">${esc(b.intro)}</p>
  </div>`;
}

const RENDER = {

hero(b, i){
  return `
  <div class="hero-media${b.bgImage ? ' has-photo' : ''}">${b.backgroundVideo ? mediaEmbed(b.backgroundVideo,{bg:true}) : ''}</div>
  <div class="hero-inner">
    <div class="eyebrow reveal" data-move="${b.id}.eyebrow" data-path="${P(i,'eyebrow')}">${esc(b.eyebrow)}</div>
    <h1 class="reveal" data-d="1" data-move="${b.id}.title">
      <span data-path="${P(i,'titleLine1')}">${esc(b.titleLine1)}</span><br>
      <span data-path="${P(i,'titleLine2')}">${esc(b.titleLine2)}</span>
      <em data-path="${P(i,'titleAccent')}">${esc(b.titleAccent)}</em></h1>
    <p class="reveal" data-d="2" data-move="${b.id}.para" data-path="${P(i,'paragraph')}">${esc(b.paragraph)}</p>
    <div class="btn-row reveal" data-d="3" data-move="${b.id}.buttons" data-list="${P(i,'buttons')}">
      ${(b.buttons||[]).map((x,j)=>`<a href="${esc(x.link)}" class="btn${x.solid?' solid':''}"
         data-item="${P(i,'buttons')}.${j}"><span data-path="${P(i,'buttons',j,'label')}">${esc(x.label)}</span></a>`).join('')}
    </div>
  </div>
  <div class="scroll-hint" data-path="${P(i,'scrollText')}">${esc(b.scrollText ?? 'Scroll')}</div>`;
},

marquee(b, i){
  const items = b.items || [];
  // only the first copy is editable; the second is the seamless-loop clone
  const one   = items.map((x,j)=>`<span data-path="${P(i,'items',j)}">${esc(x)}</span><i>—</i>`).join('');
  const clone = items.map(x=>`<span>${esc(x)}</span><i>—</i>`).join('');
  return `<div class="marquee-track">${one+clone}</div>`;
},

projects(b, i){
  return head(b,i) + `<div class="work-grid c${b.columns||2}" data-list="${P(i,'items')}">` +
    (b.items||[]).map((p,j)=>{
      const poster = p.thumbnail || posterUrl(p.videoUrl);
      return `<article class="project reveal" data-item="${P(i,'items')}.${j}" data-video="${esc(p.videoUrl)}">
        <div class="thumb" data-media="${P(i,'items',j,'thumbnail')}" data-kind="project"
             data-video-path="${P(i,'items',j,'videoUrl')}" data-hasvideo="${p.videoUrl?'1':''}">
          ${poster ? `<img src="${esc(poster)}" alt="${esc(p.title)}">`
                   : `<div class="ph-label"><b>${String(j+1).padStart(2,'0')}</b>Add thumbnail</div>`}
          <div class="play"></div>
        </div>
        <div class="p-meta">
          <h3 data-path="${P(i,'items',j,'title')}">${esc(p.title)}</h3>
          <span data-path="${P(i,'items',j,'category')}">${esc(p.category)}</span>
        </div></article>`;
    }).join('') + `</div>`;
},

gallery(b, i){
  return head(b,i) + `<div class="g-grid c${b.columns||4}" data-list="${P(i,'items')}">` +
    (b.items||[]).map((p,j)=>`
      <div class="g-item reveal" data-d="${j%4}" data-item="${P(i,'items')}.${j}"
           data-media="${P(i,'items',j,'image')}">
        ${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.alt)}">`
                  : `<div class="ph-label">${esc(p.alt||'Photo')}</div>`}
      </div>`).join('') + `</div>`;
},

services(b, i){
  return head(b,i) + `<div class="s-grid c${b.columns||2}" data-list="${P(i,'items')}">` +
    (b.items||[]).map((c,j)=>`
      <div class="s-card reveal" data-item="${P(i,'items')}.${j}">
        <div class="n" data-path="${P(i,'items',j,'number')}">${esc(c.number)}</div>
        <h3 data-path="${P(i,'items',j,'title')}">${esc(c.title)}</h3>
        <p data-path="${P(i,'items',j,'description')}">${esc(c.description)}</p>
        <ul data-list="${P(i,'items',j,'bullets')}">${(c.bullets||[]).map((x,k)=>
          `<li data-item="${P(i,'items',j,'bullets')}.${k}" data-path="${P(i,'items',j,'bullets',k)}">${esc(x)}</li>`).join('')}</ul>
      </div>`).join('') + `</div>`;
},

about(b, i){
  return `<div class="a-wrap${b.flip?' flip':''}">
    <div class="a-photo reveal" data-move="${b.id}.photo" data-media="${P(i,'photo')}">
      ${b.photo ? `<img src="${esc(b.photo)}" alt="${esc(b.heading)}">` : `<div class="ph-label">Portrait photo</div>`}
    </div>
    <div class="a-text" data-move="${b.id}.text">
      <div class="sec-num reveal" data-path="${P(i,'label')}">${esc(b.label)}</div>
      <h2 class="reveal" data-d="1" data-path="${P(i,'heading')}">${esc(b.heading)}</h2>
      <div data-list="${P(i,'paragraphs')}">
        ${(b.paragraphs||[]).map((p,j)=>`<p class="reveal" data-d="${j+2}"
           data-item="${P(i,'paragraphs')}.${j}" data-path="${P(i,'paragraphs',j)}">${esc(p)}</p>`).join('')}
      </div>
      <div class="stats reveal" data-d="4" data-move="${b.id}.stats" data-list="${P(i,'stats')}">
        ${(b.stats||[]).map((s,j)=>`<div class="stat" data-item="${P(i,'stats')}.${j}">
          <b data-path="${P(i,'stats',j,'value')}">${esc(s.value)}</b>
          <span data-path="${P(i,'stats',j,'label')}">${esc(s.label)}</span></div>`).join('')}
      </div>
    </div></div>`;
},

contact(b, i){
  return `<div class="contact-blk">
    <div class="sec-num reveal" data-path="${P(i,'label')}">${esc(b.label)}</div>
    <h2 class="reveal" data-d="1" data-move="${b.id}.heading"
        data-path="${P(i,'heading')}" data-multiline="1">${multi(b.heading)}</h2>
    <p class="reveal" data-d="2" data-path="${P(i,'intro')}">${esc(b.intro)}</p>
    <a href="mailto:${esc(b.email)}" class="mail reveal" data-d="3" data-path="${P(i,'email')}">${esc(b.email)}</a>
    <div class="socials reveal" data-d="4" data-list="${P(i,'socials')}">
      ${(b.socials||[]).map((s,j)=>`<a href="${esc(s.url)}" target="_blank" rel="noopener"
         data-item="${P(i,'socials')}.${j}" data-path="${P(i,'socials',j,'label')}">${esc(s.label)}</a>`).join('')}
    </div></div>`;
},

text(b, i){
  return `<div class="txt-wrap" data-move="${b.id}.text">
    ${b.eyebrow!==undefined?`<div class="sec-num reveal" data-path="${P(i,'eyebrow')}">${esc(b.eyebrow)}</div>`:''}
    <h2 class="reveal" data-d="1" data-path="${P(i,'heading')}">${esc(b.heading)}</h2>
    <div data-list="${P(i,'paragraphs')}">
      ${(b.paragraphs||[]).map((p,j)=>`<p class="reveal" data-d="${j+2}"
        data-item="${P(i,'paragraphs')}.${j}" data-path="${P(i,'paragraphs',j)}">${esc(p)}</p>`).join('')}
    </div></div>`;
},

image(b, i){
  return `<div class="media-wrap w-${b.width||'wide'}">
    <div class="media-box reveal" data-media="${P(i,'src')}" style="aspect-ratio:${esc(b.ratio||'16/9')}">
      ${b.src ? `<img src="${esc(b.src)}" alt="${esc(b.caption||'')}">` : `<div class="ph-label">Add image</div>`}
    </div>
    <div class="media-cap reveal" data-path="${P(i,'caption')}">${esc(b.caption)}</div>
  </div>`;
},

video(b, i){
  return `<div class="media-wrap w-${b.width||'wide'}">
    <div class="media-box reveal" data-kind="videoblock" data-video-path="${P(i,'url')}"
         data-media="${P(i,'poster')}" data-hasvideo="${b.url?'1':''}">
      ${b.url ? mediaEmbed(b.url)
              : (b.poster ? `<img src="${esc(b.poster)}">` : `<div class="ph-label">Add a video link</div>`)}
    </div>
    <div class="media-cap reveal" data-path="${P(i,'caption')}">${esc(b.caption)}</div>
  </div>`;
},

buttons(b, i){
  return `<div class="btn-row reveal" data-move="${b.id}.buttons" data-list="${P(i,'items')}">
    ${(b.items||[]).map((x,j)=>`<a href="${esc(x.link)}" class="btn${x.solid?' solid':''}"
      data-item="${P(i,'items')}.${j}"><span data-path="${P(i,'items',j,'label')}">${esc(x.label)}</span></a>`).join('')}
  </div>`;
},

quote(b, i){
  return `<div class="quote-wrap">
    <blockquote class="reveal" data-path="${P(i,'text')}">${esc(b.text)}</blockquote>
    <div class="who reveal" data-d="1" data-path="${P(i,'author')}">${esc(b.author)}</div>
  </div>`;
},

logos(b, i){
  return head(b,i) + `<div class="logos reveal" data-list="${P(i,'items')}">
    ${(b.items||[]).map((x,j)=>`<div class="logo-item" data-item="${P(i,'items')}.${j}"
      data-path="${P(i,'items',j)}">${esc(x)}</div>`).join('')}
  </div>`;
},

spacer(b){ return `<div class="spacer-inner" style="--h:${parseInt(b.height)||80}px"></div>`; },

divider(){ return `<div class="divider-line"></div>`; },

};

const BLOCK_CLASS = { hero:'hero', marquee:'marquee', contact:'contact-blk-wrap',
                      spacer:'spacer', divider:'divider' };

/* ============ page render ============ */
function render(d){
  applyTheme(d.theme);
  applyStyle(d);
  document.title = d.brand?.pageTitle || 'ADKINE';

  document.getElementById('logo').innerHTML =
    `<span data-path="brand.logoStart">${esc(d.brand?.logoStart)}</span>` +
    `<span class="ki" data-path="brand.logoMiddle">${esc(d.brand?.logoMiddle)}</span>` +
    `<span data-path="brand.logoEnd">${esc(d.brand?.logoEnd)}</span>`;
  document.getElementById('links').innerHTML =
    (d.nav||[]).map((n,j)=>`<a href="${esc(n.link)}" data-item="nav.${j}" data-path="nav.${j}.label">${esc(n.label)}</a>`).join('');

  document.getElementById('blocks').innerHTML = (d.blocks||[]).map((b0,i)=>{
    const fn = RENDER[b0.type];
    if(!fn) return '';
    const b = forDevice(b0);
    const noPad = ['hero','marquee','spacer','divider'].includes(b.type);
    const cls = ['blk', BLOCK_CLASS[b.type]||'', b.bg && !noPad ? 'bg-'+b.bg : '',
                 b.align === 'center' ? 'center' : '',
                 b.hidden ? 'd-hidden' : ''].filter(Boolean).join(' ');
    const bgLayer = b.bgImage ? `<div class="blk-bg${b.bgFixed?' fixed':''}" style="
        background-image:url('${esc(b.bgImage)}');
        opacity:${b.bgOpacity ?? 0.6};
        background-position:${esc(b.bgPosition || 'center center')};
        background-size:${esc(b.bgSize || 'cover')}"></div>` : '';
    return `<section class="${cls}" id="${esc(b.id)}" data-blk="${i}" data-type="${esc(b.type)}"
             style="--pad:${b.pad ?? 1}">${bgLayer}${fn(b,i)}</section>`;
  }).join('');

  const f = d.footer || {};
  document.getElementById('footer').innerHTML =
    `<div data-path="footer.left">${esc(f.left)}</div><div data-path="footer.right">${esc(f.right)}</div>`;

  tagTexts(d);
  applyOffsets(d);
  applyTextStyles(d);
  lastDevice = device();
}

/* ============ interactions ============ */
function init(){
  const nav = document.getElementById('nav');
  addEventListener('scroll', ()=>nav.classList.toggle('scrolled', scrollY>60));

  const burger = document.getElementById('burger'), links = document.getElementById('links');
  burger.onclick = ()=>{ burger.classList.toggle('open'); links.classList.toggle('open'); };
  links.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{
    burger.classList.remove('open'); links.classList.remove('open'); }));

  const io = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  }), {threshold:.15, rootMargin:'0px 0px -60px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

  const dot = document.querySelector('.cursor'), ring = document.querySelector('.cursor-ring');
  let mx=0,my=0,rx=0,ry=0;
  addEventListener('mousemove', e=>{ mx=e.clientX; my=e.clientY;
    dot.style.transform = `translate(${mx}px,${my}px) translate(-50%,-50%)`; });
  (function loop(){ rx+=(mx-rx)*.14; ry+=(my-ry)*.14;
    ring.style.transform = `translate(${rx}px,${ry}px) translate(-50%,-50%)`;
    requestAnimationFrame(loop); })();
  document.querySelectorAll('a,.project,.burger,.g-item').forEach(el=>{
    el.addEventListener('mouseenter',()=>ring.classList.add('grow'));
    el.addEventListener('mouseleave',()=>ring.classList.remove('grow'));
  });

  const modal = document.getElementById('modal'), body = document.getElementById('modalBody');
  const defaultMsg = body.innerHTML;
  if(EDIT) return;
  document.querySelectorAll('.project').forEach(p=>{
    p.onclick = ()=>{
      body.innerHTML = p.dataset.video ? mediaEmbed(p.dataset.video) : defaultMsg;
      modal.classList.add('open'); document.body.style.overflow='hidden';
    };
  });
  function shut(){ modal.classList.remove('open'); document.body.style.overflow='';
    setTimeout(()=>body.innerHTML=defaultMsg,400); }
  document.getElementById('close').onclick = shut;
  modal.onclick = e=>{ if(e.target===modal) shut(); };
  addEventListener('keydown', e=>{ if(e.key==='Escape') shut(); });
}

/* ============ boot ============ */
const EDIT = new URLSearchParams(location.search).has('edit');

loadContent().then(d=>{
  render(d); init();
  window.ADKINE = { data:d, render, init, applyTheme, applyStyle, applyOffsets,
                    FONT_STACK, uid, esc, migrate,
                    device, setDevice, forDevice, buildDeviceCSS, applyBlockDevice,
                    DEVICE_KEYS, tkeyOf, tagTexts, applyTextStyles, textStyleFor,
                    TXT_CSS, ensureFont };
  if(EDIT){
    const s = document.createElement('script');
    s.src = '/assets/editor.js?v=' + Date.now();
    document.body.appendChild(s);
  }
});
</script>
</body>
</html>
