<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADKINE — Motion &amp; Vision</title>
<meta name="description" content="ADKINE — cinematic video production and motion design for brands and small businesses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ADKINE — luxury pastel: blue / beige / white / black
   Colours are driven by content/site.json → theme
   ============================================================ */
:root{
  --black:#16181C; --ink:#23262C; --navy:#2E4057;
  --blue:#93AEC9; --blue-pale:#DCE6F0;
  --beige:#D8C9AF; --beige-pale:#F0E9DC;
  --white:#FCFAF7;
  --line:rgba(46,64,87,.14); --muted:rgba(35,38,44,.58);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{background:var(--white);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.65;overflow-x:hidden}
::selection{background:var(--blue);color:var(--white)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

.cursor,.cursor-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;border-radius:50%;mix-blend-mode:multiply}
.cursor{width:6px;height:6px;background:var(--navy);transform:translate(-50%,-50%)}
.cursor-ring{width:34px;height:34px;border:1px solid var(--blue);transform:translate(-50%,-50%);transition:width .3s var(--ease),height .3s var(--ease),background .3s}
.cursor-ring.grow{width:64px;height:64px;background:rgba(147,174,201,.16)}
@media(hover:none),(max-width:900px){.cursor,.cursor-ring{display:none}}

nav{position:fixed;inset:0 0 auto 0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:34px 5vw;transition:all .5s var(--ease)}
nav.scrolled{padding:18px 5vw;background:rgba(252,250,247,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:19px;letter-spacing:.16em}
.logo .ki{color:var(--navy)}
.nav-links{display:flex;gap:44px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:400}
.nav-links a{position:relative;padding-bottom:4px;color:var(--muted);transition:color .4s}
.nav-links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--navy);transition:width .45s var(--ease)}
.nav-links a:hover{color:var(--ink)}
.nav-links a:hover::after{width:100%}
.burger{display:none;flex-direction:column;gap:5px;cursor:pointer}
.burger span{width:24px;height:1px;background:var(--ink);transition:.4s var(--ease)}
@media(max-width:860px){
  .nav-links{position:fixed;inset:0;background:var(--white);flex-direction:column;align-items:center;justify-content:center;gap:32px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
  .nav-links.open{opacity:1;pointer-events:all}
  .burger{display:flex;z-index:101}
  .burger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .burger.open span:nth-child(2){opacity:0}
  .burger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
}

.reveal{opacity:0;transform:translateY(38px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.reveal.in{opacity:1;transform:none}
.reveal[data-d="1"]{transition-delay:.12s}
.reveal[data-d="2"]{transition-delay:.24s}
.reveal[data-d="3"]{transition-delay:.36s}
.reveal[data-d="4"]{transition-delay:.48s}

.hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:0 5vw;overflow:hidden}
.hero-media{position:absolute;inset:0;z-index:0;background:linear-gradient(120deg,var(--blue-pale) 0%,var(--beige-pale) 55%,var(--white) 100%)}
.hero-media video,.hero-media iframe{width:100%;height:100%;object-fit:cover;border:0}
.hero-media::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(252,250,247,.92) 0%,rgba(252,250,247,.55) 50%,rgba(252,250,247,.2) 100%)}
.hero-inner{position:relative;z-index:2;max-width:1000px}
.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--navy);margin-bottom:30px;font-weight:500}
.hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(3.4rem,9.5vw,9rem);line-height:.94;letter-spacing:-.02em;color:var(--black);margin-bottom:34px}
.hero h1 em{font-style:italic;color:var(--navy)}
.hero p{max-width:440px;font-size:16px;color:var(--muted);margin-bottom:48px}
.btn-row{display:flex;gap:16px;flex-wrap:wrap}
.btn{display:inline-block;padding:17px 40px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;border:1px solid var(--navy);position:relative;overflow:hidden;transition:color .5s var(--ease)}
.btn span{position:relative;z-index:2}
.btn::before{content:'';position:absolute;inset:0;background:var(--navy);transform:translateY(101%);transition:transform .55s var(--ease)}
.btn:hover::before{transform:translateY(0)}
.btn:hover{color:var(--white)}
.btn.solid{background:var(--navy);color:var(--white)}
.btn.solid::before{background:var(--beige)}
.btn.solid:hover{color:var(--black)}
.scroll-hint{position:absolute;bottom:42px;left:5vw;z-index:2;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:14px}
.scroll-hint::after{content:'';width:52px;height:1px;background:var(--blue);animation:slide 2.4s var(--ease) infinite}
@keyframes slide{0%{transform:scaleX(0);transform-origin:left}50%{transform:scaleX(1);transform-origin:left}51%{transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}

.marquee{padding:26px 0;background:var(--navy);color:var(--beige-pale);overflow:hidden;white-space:nowrap}
.marquee-track{display:inline-flex;gap:60px;animation:scroll 34s linear infinite;font-family:var(--serif);font-size:26px;letter-spacing:.04em}
.marquee-track span{opacity:.85}
.marquee-track i{font-style:normal;color:var(--blue)}
@keyframes scroll{to{transform:translateX(-50%)}}

section{padding:clamp(90px,13vw,170px) 5vw}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:70px;flex-wrap:wrap}
.sec-num{font-size:11px;letter-spacing:.3em;color:var(--blue);font-weight:500}
.sec-head h2{font-family:var(--serif);font-weight:300;font-size:clamp(2.4rem,5.6vw,4.6rem);line-height:1.02;letter-spacing:-.015em;color:var(--black)}
.sec-head p{max-width:340px;font-size:15px;color:var(--muted)}

.work-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(20px,3.4vw,52px)}
@media(max-width:760px){.work-grid{grid-template-columns:1fr}}
.project{cursor:pointer;display:block}
.project:nth-child(even){margin-top:clamp(0px,5vw,80px)}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,var(--blue-pale),var(--beige-pale))}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.project:hover .thumb img,.project:hover .thumb video{transform:scale(1.06)}
.thumb::after{content:'';position:absolute;inset:0;background:var(--navy);opacity:0;transition:opacity .6s var(--ease)}
.project:hover .thumb::after{opacity:.14}
.ph-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--navy);opacity:.5;text-align:center;padding:12px}
.ph-label b{font-size:26px;font-family:var(--serif);font-weight:300;letter-spacing:.04em}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);width:72px;height:72px;border:1px solid var(--white);border-radius:50%;display:grid;place-items:center;opacity:0;transition:.6s var(--ease);z-index:3}
.play::after{content:'';border-left:11px solid var(--white);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:4px}
.project:hover .play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.p-meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;gap:20px}
.p-meta h3{font-family:var(--serif);font-weight:400;font-size:clamp(1.3rem,2.4vw,1.9rem);color:var(--black)}
.p-meta span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

.gallery{background:var(--beige-pale)}
.g-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.g-grid{grid-template-columns:repeat(2,1fr)}}
.g-item{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--blue-pale),var(--white));aspect-ratio:3/4}
.g-item img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.g-item:hover img{transform:scale(1.07)}

.services{background:var(--black);color:var(--beige-pale)}
.services .sec-head h2{color:var(--white)}
.services .sec-head p{color:rgba(240,233,220,.55)}
.services .sec-num{color:var(--beige)}
.s-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(240,233,220,.16)}
@media(max-width:760px){.s-grid{grid-template-columns:1fr}}
.s-card{background:var(--black);padding:clamp(38px,5vw,64px);transition:background .6s var(--ease)}
.s-card:hover{background:var(--navy)}
.s-card .n{font-size:11px;letter-spacing:.3em;color:var(--blue);margin-bottom:26px}
.s-card h3{font-family:var(--serif);font-weight:300;font-size:clamp(1.8rem,3.4vw,2.8rem);color:var(--white);margin-bottom:20px}
.s-card p{font-size:15px;color:rgba(240,233,220,.62);margin-bottom:28px}
.s-card ul{list-style:none;font-size:13px;color:rgba(240,233,220,.48)}
.s-card li{padding:9px 0;border-top:1px solid rgba(240,233,220,.13);letter-spacing:.04em}

.a-wrap{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(36px,6vw,90px);align-items:center}
@media(max-width:860px){.a-wrap{grid-template-columns:1fr}}
.a-photo{aspect-ratio:4/5;background:linear-gradient(150deg,var(--beige-pale),var(--blue-pale));overflow:hidden;position:relative}
.a-photo img{width:100%;height:100%;object-fit:cover}
.a-text h2{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.1;color:var(--black);margin:10px 0 28px}
.a-text p{font-size:16px;color:var(--muted);margin-bottom:20px;max-width:520px}
.stats{display:flex;gap:52px;margin-top:44px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--serif);font-size:2.6rem;font-weight:300;color:var(--navy);line-height:1}
.stat span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

.contact{background:var(--navy);color:var(--white);text-align:center}
.contact .sec-num{color:var(--beige)}
.contact h2{font-family:var(--serif);font-weight:300;font-size:clamp(2.6rem,7vw,6rem);line-height:1.02;margin:18px 0 34px}
.contact p{color:rgba(252,250,247,.6);max-width:420px;margin:0 auto 46px;font-size:16px}
.mail{display:inline-block;font-family:var(--serif);font-size:clamp(1.3rem,3.4vw,2.4rem);color:var(--beige-pale);border-bottom:1px solid rgba(216,201,175,.4);padding-bottom:8px;transition:.5s var(--ease)}
.mail:hover{color:var(--beige);border-color:var(--beige)}
.socials{display:flex;gap:34px;justify-content:center;margin-top:56px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(252,250,247,.55)}
.socials a:hover{color:var(--beige)}

footer{background:var(--black);color:rgba(240,233,220,.42);padding:38px 5vw;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.14em;flex-wrap:wrap;gap:14px}

.modal{position:fixed;inset:0;z-index:500;background:rgba(22,24,28,.94);display:grid;place-items:center;padding:5vw;opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.modal.open{opacity:1;pointer-events:all}
.modal-inner{width:min(1100px,100%);aspect-ratio:16/9;background:var(--ink);position:relative}
.modal-inner iframe,.modal-inner video{width:100%;height:100%;border:0;object-fit:cover}
.modal-ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--blue);font-size:12px;letter-spacing:.24em;text-transform:uppercase;text-align:center;padding:20px;line-height:2}
.close{position:absolute;top:-46px;right:0;color:var(--beige-pale);font-size:11px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer}
</style>
</head>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- load content ---------- */
async function loadContent(){
  try{
    const r = await fetch('content/site.json', {cache:'no-store'});
    if(r.ok) return await r.json();
  }catch(e){/* falls through */}
  return JSON.parse(document.getElementById('fallback').textContent);
}

/* ---------- theme ---------- */
function applyTheme(t={}){
  const map = {blue:'--blue',navy:'--navy',beige:'--beige',beigePale:'--beige-pale',bluePale:'--blue-pale',white:'--white',black:'--black'};
  for(const k in map) if(t[k]) document.documentElement.style.setProperty(map[k], t[k]);
}

/* ---------- video links: accept ANY youtube/vimeo url ---------- */
function videoInfo(url){
  if(!url) return null;
  const s = String(url).trim();
  let m;
  if((m = s.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{6,})/)))
    return {type:'yt', id:m[1]};
  if((m = s.match(/(?:vimeo\.com\/(?:video\/)?|player\.vimeo\.com\/video\/)(\d+)/)))
    return {type:'vimeo', id:m[1]};
  return null;
}
function embedUrl(url){
  const v = videoInfo(url);
  if(!v) return url;
  return v.type === 'yt'
    ? `https://www.youtube.com/embed/${v.id}`
    : `https://player.vimeo.com/video/${v.id}`;
}
function posterUrl(url){
  const v = videoInfo(url);
  return (v && v.type === 'yt') ? `https://img.youtube.com/vi/${v.id}/hqdefault.jpg` : '';
}

/* ---------- media helper: url → embed or <img>/<video> ---------- */
function mediaEmbed(url, opts={}){
  if(!url) return '';
  const u = esc(embedUrl(url));
  if(/\.(mp4|webm|mov)$/i.test(url)){
    const a = opts.bg ? 'autoplay muted loop playsinline' : 'controls playsinline';
    return `<video src="${u}" ${a}></video>`;
  }
  return `<iframe src="${u}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
}

/* ---------- render ---------- */
function render(d){
  applyTheme(d.theme);
  document.title = d.brand?.pageTitle || 'ADKINE';

  /* nav */
  document.getElementById('logo').innerHTML =
    `${esc(d.brand?.logoStart)}<span class="ki">${esc(d.brand?.logoMiddle)}</span>${esc(d.brand?.logoEnd)}`;
  document.getElementById('links').innerHTML =
    (d.nav||[]).map(n=>`<a href="${esc(n.link)}">${esc(n.label)}</a>`).join('');

  /* hero */
  const h = d.hero||{};
  if(h.backgroundVideo) document.getElementById('heroMedia').innerHTML = mediaEmbed(h.backgroundVideo,{bg:true});
  document.getElementById('heroInner').innerHTML = `
    <div class="eyebrow reveal" data-move="hero.eyebrow" data-path="hero.eyebrow">${esc(h.eyebrow)}</div>
    <h1 class="reveal" data-d="1" data-move="hero.title"><span data-path="hero.titleLine1">${esc(h.titleLine1)}</span><br><span data-path="hero.titleLine2">${esc(h.titleLine2)}</span> <em data-path="hero.titleAccent">${esc(h.titleAccent)}</em></h1>
    <p class="reveal" data-d="2" data-move="hero.paragraph" data-path="hero.paragraph">${esc(h.paragraph)}</p>
    <div class="btn-row reveal" data-d="3" data-move="hero.buttons">
      <a href="${esc(h.primaryLink)}" class="btn solid"><span data-path="hero.primaryLabel">${esc(h.primaryLabel)}</span></a>
      <a href="${esc(h.secondaryLink)}" class="btn"><span data-path="hero.secondaryLabel">${esc(h.secondaryLabel)}</span></a>
    </div>`;

  /* marquee (doubled for seamless loop) */
  const words = (d.marquee||[]).map(w=>`<span>${esc(w)}</span><i>—</i>`).join('');
  document.getElementById('marquee').innerHTML = words + words;

  /* head helper */
  const head = (s, k) => `
    <div class="sec-head" data-move="${k}.head">
      <div>
        <div class="sec-num reveal" data-path="${k}.label">${esc(s.label)}</div>
        <h2 class="reveal" data-d="1" data-path="${k}.heading">${esc(s.heading)}</h2>
      </div>
      <p class="reveal" data-d="2" data-path="${k}.intro">${esc(s.intro)}</p>
    </div>`;

  /* work */
  const w = d.work||{};
  document.getElementById('work').innerHTML = head(w,'work') + `<div class="work-grid">` +
    (w.projects||[]).map((p,i)=>{
      const poster = p.thumbnail || posterUrl(p.videoUrl);   // YouTube gives us a still for free
      return `
      <article class="project reveal" ${i%2?'data-d="1"':''} data-video="${esc(p.videoUrl)}">
        <div class="thumb" data-media="work.projects.${i}.thumbnail" data-kind="project"
             data-video-path="work.projects.${i}.videoUrl" data-del="work.projects.${i}"
             data-hasvideo="${p.videoUrl ? '1' : ''}">
          ${poster ? `<img src="${esc(poster)}" alt="${esc(p.title)}">`
                   : `<div class="ph-label"><b>${String(i+1).padStart(2,'0')}</b>Add thumbnail</div>`}
          <div class="play"></div>
        </div>
        <div class="p-meta"><h3 data-path="work.projects.${i}.title">${esc(p.title)}</h3><span data-path="work.projects.${i}.category">${esc(p.category)}</span></div>
      </article>`;
    }).join('') + `</div>`;

  /* gallery */
  const g = d.gallery||{};
  document.getElementById('gallery').innerHTML = head(g,'gallery') + `<div class="g-grid">` +
    (g.photos||[]).map((p,i)=>`
      <div class="g-item reveal" data-d="${i%4}" data-media="gallery.photos.${i}.image" data-del="gallery.photos.${i}">
        ${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.alt)}">`
                  : `<div class="ph-label">${esc(p.alt||'Photo')}</div>`}
      </div>`).join('') + `</div>`;

  /* services */
  const s = d.services||{};
  document.getElementById('services').innerHTML = head(s,'services') + `<div class="s-grid">` +
    (s.items||[]).map((c,i)=>`
      <div class="s-card reveal" ${i?'data-d="1"':''}>
        <div class="n" data-path="services.items.${i}.number">${esc(c.number)}</div>
        <h3 data-path="services.items.${i}.title">${esc(c.title)}</h3>
        <p data-path="services.items.${i}.description">${esc(c.description)}</p>
        <ul>${(c.bullets||[]).map((b,j)=>`<li data-path="services.items.${i}.bullets.${j}">${esc(b)}</li>`).join('')}</ul>
      </div>`).join('') + `</div>`;

  /* about */
  const a = d.about||{};
  document.getElementById('about').innerHTML = `
    <div class="a-wrap">
      <div class="a-photo reveal" data-move="about.photo" data-media="about.photo">
        ${a.photo ? `<img src="${esc(a.photo)}" alt="${esc(a.heading)}">` : `<div class="ph-label">Portrait photo</div>`}
      </div>
      <div class="a-text" data-move="about.text">
        <div class="sec-num reveal" data-path="about.label">${esc(a.label)}</div>
        <h2 class="reveal" data-d="1" data-path="about.heading">${esc(a.heading)}</h2>
        ${(a.paragraphs||[]).map((p,i)=>`<p class="reveal" data-d="${i+2}" data-path="about.paragraphs.${i}">${esc(p)}</p>`).join('')}
        <div class="stats reveal" data-d="4" data-move="about.stats">
          ${(a.stats||[]).map((st,i)=>`<div class="stat"><b data-path="about.stats.${i}.value">${esc(st.value)}</b><span data-path="about.stats.${i}.label">${esc(st.label)}</span></div>`).join('')}
        </div>
      </div>
    </div>`;

  /* contact — heading allows <br> */
  const c = d.contact||{};
  document.getElementById('contact').innerHTML = `
    <div class="sec-num reveal" data-path="contact.label">${esc(c.label)}</div>
    <h2 class="reveal" data-d="1" data-move="contact.heading">${String(c.heading||'').replace(/<br\s*\/?>/gi,'<br>').replace(/<(?!br>)/g,'&lt;')}</h2>
    <p class="reveal" data-d="2" data-move="contact.intro" data-path="contact.intro">${esc(c.intro)}</p>
    <a href="mailto:${esc(c.email)}" class="mail reveal" data-d="3" data-move="contact.email" data-path="contact.email">${esc(c.email)}</a>
    <div class="socials reveal" data-d="4" data-move="contact.socials">
      ${(c.socials||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join('')}
      <a href="#top">Top</a>
    </div>`;

  /* footer */
  const f = d.footer||{};
  document.getElementById('footer').innerHTML =
    `<div data-path="footer.left">${esc(f.left)}</div><div data-path="footer.right">${esc(f.right)}</div>`;

  /* section order */
  const foot = document.getElementById('footer');
  (d.sectionOrder || ['work','gallery','services','about','contact']).forEach(id=>{
    const el = document.getElementById(id);
    if(el) foot.parentNode.insertBefore(el, foot);
  });

  applyOffsets(d);
}

/* free-positioned blocks — desktop only, so phones keep the clean layout */
function applyOffsets(d){
  const o = d.offsets || {};
  const on = innerWidth > 900;
  document.querySelectorAll('[data-move]').forEach(el=>{
    const v = o[el.dataset.move];
    el.style.transform = (on && v && (v.x || v.y)) ? `translate(${v.x}px,${v.y}px)` : '';
  });
}
addEventListener('resize', ()=>{ if(window.ADKINE) applyOffsets(window.ADKINE.data); });

/* ---------- interactions (run after render) ---------- */
function init(){
  const nav=document.getElementById('nav');
  addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>60));

  const burger=document.getElementById('burger'),links=document.getElementById('links');
  burger.onclick=()=>{burger.classList.toggle('open');links.classList.toggle('open')};
  links.querySelectorAll('a').forEach(a=>a.onclick=()=>{burger.classList.remove('open');links.classList.remove('open')});

  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}
  }),{threshold:.15,rootMargin:'0px 0px -60px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

  const dot=document.querySelector('.cursor'),ring=document.querySelector('.cursor-ring');
  let mx=0,my=0,rx=0,ry=0;
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.transform=`translate(${mx}px,${my}px) translate(-50%,-50%)`});
  (function loop(){rx+=(mx-rx)*.14;ry+=(my-ry)*.14;ring.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`;requestAnimationFrame(loop)})();
  document.querySelectorAll('a,.project,.burger,.g-item').forEach(el=>{
    el.addEventListener('mouseenter',()=>ring.classList.add('grow'));
    el.addEventListener('mouseleave',()=>ring.classList.remove('grow'));
  });

  const modal=document.getElementById('modal'),body=document.getElementById('modalBody');
  const defaultMsg=body.innerHTML;
  if(EDIT) return;               // in edit mode the popup player stays out of the way
  document.querySelectorAll('.project').forEach(p=>{
    p.onclick=()=>{
      const src=p.dataset.video;
      body.innerHTML = src ? mediaEmbed(src) : defaultMsg;
      modal.classList.add('open');
      document.body.style.overflow='hidden';
    };
  });
  function shut(){modal.classList.remove('open');document.body.style.overflow='';setTimeout(()=>body.innerHTML=defaultMsg,400)}
  document.getElementById('close').onclick=shut;
  modal.onclick=e=>{if(e.target===modal)shut()};
  addEventListener('keydown',e=>{if(e.key==='Escape')shut()});
}

/* ---------- boot ---------- */
const EDIT = new URLSearchParams(location.search).has('edit');

loadContent().then(d=>{
  render(d);
  init();
  // expose for the visual editor
  window.ADKINE = { data:d, render, applyTheme, applyOffsets, init };
  if(EDIT){
    const s=document.createElement('script');
    s.src='/assets/editor.js?v=' + Date.now();
    document.body.appendChild(s);
  }
});
</script>
</body>
