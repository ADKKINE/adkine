<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ADKINE — Admin</title>
  <style>
    body{margin:0;font-family:Inter,-apple-system,sans-serif}
    #boot{
      position:fixed;inset:0;display:grid;place-items:center;
      background:#FCFAF7;color:#2E4057;z-index:5;
      font-size:12px;letter-spacing:.24em;text-transform:uppercase;
    }
  </style>
</head>
<body>
  <div id="boot">Loading ADKINE admin…</div>

  <!-- Sveltia CMS — modern, mobile-friendly, Decap-config compatible -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>

  <script>
    // hide the boot screen once the CMS paints
    const boot = document.getElementById('boot');
    const check = setInterval(() => {
      if (document.querySelector('#nc-root, .sveltia-cms, [class*="sveltia"]')) {
        boot.style.display = 'none';
        clearInterval(check);
      }
    }, 300);
    setTimeout(() => { boot.style.display = 'none'; clearInterval(check); }, 8000);
  </script>
</body>
</html>
